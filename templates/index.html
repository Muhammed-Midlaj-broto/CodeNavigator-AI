<!DOCTYPE html>
<html>
<head>
    <title>Codebase Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: white; font-family: 'Inter', sans-serif; display: flex; align-items: center; min-height: 100vh; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 3rem; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        .btn-primary { background: #38bdf8; border: none; padding: 12px 30px; font-weight: 600; transition: 0.3s; }
        .btn-primary:hover { background: #0ea5e9; transform: translateY(-2px); box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }
        input.form-control { background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 15px; }
        input.form-control:focus { background: rgba(15, 23, 42, 0.8); color: white; border-color: #38bdf8; box-shadow: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="glass-card">
                <h1 class="mb-2 fw-bold">Codebase <span style="color: #38bdf8;">Analyzer</span></h1>
                <p class="text-secondary mb-4">Paste a GitHub URL to visualize its structure</p>
                <form action="/analyze" method="POST">
                    <div class="mb-4">
                        <input type="text" name="repo_url" class="form-control text-center" placeholder="https://github.com/gin-gonic/gin" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Analyze Repository</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
